<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极简高级聊天室</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --btn-color: #07c475; 
            --bubble-me: #dcf8c6; 
            --bg-gray: #f5f5f5;
            --text-main: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-gray); 
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- 登录区域 --- */
        #login-area { position: fixed; inset: 0; background: white; display: flex; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
        .login-box { width: 100%; max-width: 400px; padding: 40px; border: 1px solid #eee; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .login-box h2 { margin-bottom: 30px; text-align: center; color: #333; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; outline: none; }
        button { width: 100%; padding: 14px; background: var(--btn-color); color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; }

        /* --- 主应用容器 (电脑端优化) --- */
        #main-app { 
            display: none; 
            flex-direction: column; 
            height: 100vh; 
            width: 100%; 
            max-width: 900px; /* 限制电脑端最大宽度 */
            margin: 0 auto; 
            background: white; 
            position: relative; 
            border-left: 1px solid #eee; 
            border-right: 1px solid #eee; 
        }

        /* --- 顶部导航栏 --- */
        #top-nav { height: 60px; background: #f9f9f9; border-bottom: 1px solid #eee; display: flex; align-items: center; padding: 0 15px; }
        #back-btn { display: none; cursor: pointer; font-size: 24px; margin-right: 10px; } 
        #room-title { font-weight: bold; font-size: 18px; color: #333; flex: 1; text-align: center; }
        #nav-right-icons { display: flex; align-items: center; gap: 15px; }

        /* --- 视图容器 (核心修复：flex: 1 确保占据上方空间) --- */
        .view-container { 
            flex: 1; /* 这行保证了聊天内容区域会撑开，把输入框挤到最下面 */
            overflow-y: auto; 
            position: relative; 
            background: white; 
            padding: 20px;
        }
        .hidden { display: none !important; }

        /* --- 联系人列表样式 --- */
        #contact-list { padding: 10px; }
        .contact-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .avatar { width: 48px; height: 48px; background: #ddd; border-radius: 50%; margin-right: 15px; }
        .contact-info .name { display: block; font-weight: bold; font-size: 16px; }
        .contact-info .last-msg { color: #999; font-size: 13px; }

        /* --- 聊天界面样式 --- */
        #chat-box { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            background-color: #ffffff; 
            padding: 10px; /* 稍微减小内边距让内容更充实 */
        }
        .msg-wrapper { max-width: 80%; position: relative; animation: msgIn 0.2s ease-out; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .left { align-self: flex-start; }
        .right { align-self: flex-end; text-align: right; }
        .msg-content { padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-break: break-word; position: relative; }
        .left .msg-content { background: white; color: #333; border: 1px solid #e0e0e0; border-radius: 8px 8px 8px 2px; }
        .right .msg-content { background: var(--bubble-me); color: #000; border-radius: 8px 8px 2px 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sender-name { font-size: 12px; margin-bottom: 4px; display: block; color: #666; }
        .msg-time { font-size: 10px; color: #999; margin-top: 4px; display: block; }

        /* --- 输入区域 (固定在底部) --- */
        #input-area { padding: 15px; background: white; border-top: 1px solid #eee; }
        .input-wrapper { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            height: 46px; 
            background: white;
        }
        #message-input { 
            flex: 1; 
            padding: 0 20px; 
            border: 1px solid #ddd; 
            border-radius: 23px; /* 圆角胶囊 */
            outline: none; 
            font-size: 16px;
        }
        #send-btn { 
            flex: 0 0 auto; 
            width: 85px;    /* 固定宽度 */
            background: var(--btn-color); 
            color: white; 
            border: none; 
            border-radius: 23px; /* 圆角胶囊 */
            font-weight: bold; 
            height: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer;
        }

        /* --- 底部导航栏 --- */
        #bottom-nav { height: 65px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { text-align: center; font-size: 12px; color: #999; cursor: pointer; }
        .nav-item.active { color: var(--btn-color); }

        /* --- 弹窗样式 --- */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 5000; backdrop-filter: blur(2px); }
        .modal-content { background: white; padding: 30px; border-radius: 24px; width: 90%; max-width: 400px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .close-x { position: absolute; top: 15px; right: 15px; font-size: 28px; cursor: pointer; color: #999; border: none; background: none; line-height: 1; padding: 0; z-index: 10; }

        .hidden { display: none !important; }
    </style>
</head>
<body id="app-body">

<!-- 登录界面 -->
<div id="login-area">
    <div class="login-box">
        <h2 style="margin-bottom:30px;">欢迎进入</h2>
        <input type="text" id="reg-username" placeholder="输入用户名注册/登录">
        <button onclick="handleAuth()">开始使用</button>
    </div>
</div>

<!-- 主应用 -->
<div id="main-app">
    <div id="top-nav">
        <span id="back-btn" onclick="goBack()">←</span>
        <span id="room-title">消息</span>
        <div id="nav-right-icons">
            <span id="add-room-btn" style="font-size: 24px; cursor:pointer;" onclick="showCreateRoomModal()">➕</span>
            <span style="font-size: 20px; cursor:pointer;" onclick="toggleSettings()">⚙️</span>
        </div>
    </div>

    <!-- 联系人列表视图 -->
    <div id="view-contacts" class="view-container">
        <div id="contact-list"></div>
    </div>

    <!-- 聊天窗口视图 -->
    <div id="view-chat" class="view-container hidden">
        <div id="chat-box"></div>
        <!-- 输入区域在最底部，且独立于消息列表容器外（或作为其兄弟节点） -->
        <div id="input-area">
            <div class="input-wrapper">
                <input type="text" id="message-input" placeholder="输入消息...">
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div id="bottom-nav">
        <div class="nav-item active" id="nav-msg" onclick="switchView('contacts')">💬<br>消息</div>
        <div class="nav-item" id="nav-list" onclick="alert('通讯录功能开发中')">👥<br>通讯录</div>
        <div class="nav-item" id="nav-me" onclick="alert('我的设置')">👤<br>我</div>
    </div>

    <!-- 创建房间弹窗 -->
    <div id="create-room-modal" class="modal">
        <div class="modal-content">
            <button class="close-x" onclick="hideModal('create-room-modal')">&times;</button>
            <h3 style="margin-bottom:20px;">创建新房间</h3>
            <input type="text" id="new-room-code" placeholder="输入房间代码">
            <input type="text" id="new-room-name" placeholder="显示名称">
            <button onclick="createRoom()">确认创建</button>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="settings-modal" class="modal" onclick="toggleSettings(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-x" onclick="hideModal('settings-modal')">&times;</button>
            <h3 style="margin-bottom:20px;">个性化设置</h3>
            <input type="text" id="custom-room-name" placeholder="修改当前房间名称">
            <button onclick="updateRoomName()">保存更改</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://nryaxymneqyakeykulzq.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yeWF4eW1uZXF5YWtleWt1bHpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjE3MTMsImV4cCI6MjEwMTAzNzcxM30.8DxcRaDXRBNopYo7F0bbwvHyyC7cE4zQuxn9C2ayj4M';
    
    let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentRoomId = null;
    let roomSubscription = null;

    async function handleAuth() {
        const usernameInput = document.getElementById('reg-username').value.trim();
        if (!usernameInput) return alert("请输入用户名");

        try {
            const { data, error } = await supabaseClient.from('profiles').upsert({ 
                username: usernameInput,
                updated_at: new Date().toISOString()
            }, { onConflict: 'username' }).select();

            if (error) throw error;

            currentUser = { id: data[0].id, username: data[0].username };
            localStorage.setItem('chat_user', JSON.stringify(currentUser));

            document.getElementById('login-area').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            loadRooms();
        } catch (err) {
            console.error("认证失败:", err);
            if(err.message.includes("unique constraint")) alert("该用户名已被占用，请换一个名字。");
            else alert("操作失败，请检查数据库权限或网络连接。");
        }
    }

    window.onload = () => {
        const savedUser = localStorage.getItem('chat_user');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            document.getElementById('login-area').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            loadRooms();
        }
    };

    async function loadRooms() {
        const { data: rooms } = await supabaseClient.from('rooms').select('*');
        const list = document.getElementById('contact-list');
        list.innerHTML = "";
        if (rooms && rooms.length > 0) {
            rooms.forEach(room => {
                const div = document.createElement('div');
                div.className = 'contact-item';
                div.onclick = () => enterRoom(room.id, room.room_code, room.room_name);
                div.innerHTML = `
                    <div class="avatar"></div>
                    <div class="contact-info">
                        <span class="name">${room.room_name}</span>
                        <span class="last-msg">点击进入对话...</span>
                    </div>`;
                list.appendChild(div);
            });
        } else {
            list.innerHTML = "<p style='padding:20px; color:#999;'>暂无房间，点击右上角+号创建</p>";
        }
    }

    async function createRoom() {
        const code = document.getElementById('new-room-code').value.trim();
        const name = document.getElementById('new-room-name').value.trim();
        if (!code || !name) return alert("请填写完整信息");

        const { error } = await supabaseClient.from('rooms').insert([{ 
            room_code: code, 
            room_name: name 
        }]);

        if (error) return alert("创建失败：" + error.message);
        hideModal('create-room-modal');
        loadRooms();
    }

    async function enterRoom(id, code, name) {
        currentRoomId = id;
        document.getElementById('room-title').innerText = name;
        switchView('chat');
        loadHistory();
        initRealtime();
    }

    async function loadHistory() {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = "";
        
        const { data } = await supabaseClient.from('messages')
            .select(`
                content, 
                created_at,
                profiles ( username )
            `)
            .eq('room_id', currentRoomId)
            .order('created_at', { ascending: true });

        if (data) data.forEach(msg => {
            const senderName = msg.profiles ? msg.profiles.username : "未知用户";
            appendMessageToUI(senderName, msg.content);
        });
    }

    function initRealtime() {
        if (roomSubscription) roomSubscription.unsubscribe();
        roomSubscription = supabaseClient.channel(`room_${currentRoomId}`)
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, 
            (payload) => {
                const msg = payload.new;
                appendMessageToUI("系统", msg.content); 
            })
            .subscribe();
    }

    async function sendMessage() {
        const input = document.getElementById('message-input');
        const content = input.value.trim();
        if (!content) return;

        await supabaseClient.from('messages').insert([{ 
            room_id: currentRoomId, 
            sender_id: currentUser.id, 
            content: content 
        }]);
        input.value = "";
    }

    function appendMessageToUI(sender, content) {
        const chatBox = document.getElementById('chat-box');
        const isMe = sender === currentUser.username;
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${isMe ? 'right' : 'left'}`;
        wrapper.innerHTML = `
            <div class="msg-content">
                ${!isMe ? `<span class="sender-name">${sender}</span>` : ''}
                <div style="white-space: pre-wrap;">${content}</div>
                <span class="msg-time">${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
            </div>`;
        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function switchView(view) {
        const contactView = document.getElementById('view-contacts');
        const chatView = document.getElementById('view-chat');
        const addBtn = document.getElementById('add-room-btn');
        const backBtn = document.getElementById('back-btn');

        if (view === 'contacts') {
            contactView.classList.remove('hidden');
            chatView.classList.add('hidden');
            addBtn.style.display = 'block'; 
            backBtn.style.display = 'none'; // 列表页隐藏箭头
        } else {
            contactView.classList.add('hidden');
            chatView.classList.remove('hidden');
            addBtn.style.display = 'none'; 
            backBtn.style.display = 'block'; // 进入房间显示箭头
        }

        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if (view === 'contacts') document.getElementById('nav-msg').classList.add('active');
    }

    function goBack() { switchView('contacts'); }
    function showCreateRoomModal() { document.getElementById('create-room-modal').style.display = 'flex'; }
    function hideModal(id) { document.getElementById(id).style.display = 'none'; }
    function toggleSettings(e) {
        if (e) return;
        const modal = document.getElementById('settings-modal');
        modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }

    async function updateRoomName() {
        const newName = document.getElementById('custom-room-name').value;
        if (!newName) return;
        await supabaseClient.from('rooms').update({ room_name: newName }).eq('id', currentRoomId);
        document.getElementById('room-title').innerText = newName;
        hideModal('settings-modal');
    }

    document.getElementById('message-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
