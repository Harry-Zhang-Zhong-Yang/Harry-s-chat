<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>极简高级聊天室</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --btn-color: #0084ff; 
            --bubble-color: #0084ff; 
            --bg-color: #f0f2f5; 
            --msg-others: #ffffff;
            --text-main: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); 
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- 更新公告弹窗 --- */
        #update-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: none; align-items: center; justify-content: center; z-index: 5000;
            backdrop-filter: blur(4px);
        }
        .update-modal-content {
            background: white; padding: 30px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center;
            animation: modalIn 0.3s ease-out;
        }
        @keyframes modalIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- 登录区域 --- */
        #login-area { position: fixed; inset: 0; background: white; display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .login-box { width: 100%; max-width: 400px; padding: 40px; border: 1px solid #eee; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .login-box h2 { margin-bottom: 30px; text-align: center; color: #333; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; outline: none; transition: all 0.2s; }
        input:focus { border-color: var(--btn-color); box-shadow: 0 0 0 3px rgba(0,132,255,0.1); }
        button { width: 100%; padding: 14px; background: var(--btn-color); color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }

        .remember-me { display: flex; align-items: center; gap: 8px; margin-top: -5px; margin-bottom: 15px; font-size: 14px; color: #666; cursor: pointer; }
        .remember-me input { width: auto; margin: 0; }

        /* --- 聊天主容器 --- */
