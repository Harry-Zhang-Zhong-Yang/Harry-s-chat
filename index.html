<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极简微信聊天室</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #07c475; /* 微信绿 */
            --bg-gray: #f5f5f5;
            --msg-self: #95ec69;
            --msg-other: #ffffff;
            --text-main: #000000;
            --nav-bg: #f7f7f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-gray); 
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- 更新公告弹窗 --- */
        #update-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: none; align-items: center; justify-content: center; z-index: 5000;
            backdrop-filter: blur(4px);
        }
        .update-modal-content {
            background: white; padding: 30px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center;
        }

        /* --- 登录区域 --- */
        #login-area { position: fixed; inset: 0; background: white; display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .login-box { width: 100%; max-width: 400px; padding: 40px; border: 1px solid #eee; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .login-box h2 { margin-bottom: 30px; text-align: center; color: #333; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; outline: none; }
        button { width: 100%; padding: 14px; background: var(--primary-color); color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; }

        /* --- 主应用容器 --- */
        #main-app { display: none; flex-direction: column; height: 100vh; width: 100%; max-width: 600px; margin: 0 auto; background: white; position: relative; }

        /* --- 顶部导航栏 --- */
        #top-nav { 
            height: 55px; background: #f7f7f7; border-bottom: 1px solid #ddd;
            display: flex; align-items: center; padding: 0 15px; justify-content: space-between;
        }
        #room-title { font-weight: bold; font-size: 18px; color: #333; }

        /* --- 视图切换逻辑 --- */
        .view-container { flex: 1; overflow-y: auto; position: relative; background: white; }
        .hidden { display: none !important; }

        /* --- 联系人列表 (仿微信) --- */
        #contact-list { padding: 10px; }
        .contact-item { 
            display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer;
        }
        .avatar { width: 48px; height: 48px; background: #ddd; border-radius: 50%; margin-right: 12px; }
        .contact-info .name { font-weight: bold; display: block; font-size: 16px; }
        .contact-info .last-msg { font-size: 13px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 200px; }

        /* --- 聊天窗口优化 --- */
        #chat-box { 
            flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 15px; 
            background-color: #f3f3f3; 
            background-image: url('https://user-images.githubusercontent.com/15075759/28449166-86d8e9a0-733c-4b1f-bb0e-4303309931cf.png');
            background-size: cover; background-attachment: fixed;
        }

        /* 消息气泡 */
        .msg-wrapper { max-width: 85%; position: relative; animation: msgIn 0.2s ease-out; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .left { align-self: flex-start; }
        .right { align-self: flex-end; text-align: right; }

        .msg-content { 
            padding: 10px 14px; border-radius: 8px; font-size: 15px; line-height: 1.5; 
            word-break: break-word; position: relative;
        }
        .left .msg-content { background: var(--msg-other); color: #000; border-radius: 8px 8px 8px 2px; }
        .right .msg-content { background: var(--msg-self); color: #000; border-radius: 8px 8px 2px 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        .sender-name { font-size: 12px; margin-bottom: 4px; display: block; color: #666; }
        .msg-time { font-size: 10px; color: #999; margin-top: 4px; display: block; }

        /* --- 输入区域 --- */
        #input-area { padding: 10px; background: white; border-top: 1px solid #ddd; }
        .input-wrapper { display: flex; align-items: center; gap: 10px; }
        #message-input { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 16px; }
        #send-btn { width: auto; padding: 8px 20px; background: var(--primary-color); color: white; border: none; border-radius: 20px; font-weight: bold; }

        /* --- 底部导航栏 (微信风格) --- */
        #bottom-nav { 
            height: 60px; background: #f7f7f7; border-top: 1px solid #ddd;
            display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { text-align: center; font-size: 12px; color: #555; cursor: pointer; }
        .nav-item.active { color: var(--primary-color); }

        /* 回复预览 */
        #reply-preview {
            background: rgba(0,0,0,0.05); padding: 8px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; display: none;
        }

        /* 设置弹窗 */
        #settings-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal-content { background: white; padding: 30px; border-radius: 24px; width: 90%; max-width: 450px; position: relative; }
    </style>
</head>
<body id="app-body">

<!-- 更新公告 -->
<div id="update-modal" onclick="closeUpdateModal()">
    <div class="update-modal-content">
        <h2>✨ 版本更新</h2>
        <p style="margin: 20px 0;">已优化微信风格导航、联系人列表及历史消息加载逻辑。</p>
        <button onclick="closeUpdateModal()">我知道了</button>
    </div>
</div>

<!-- 登录界面 -->
<div id="login-area">
    <div class="login-box">
        <h2>进入聊天室</h2>
        <input type="text" id="username" placeholder="输入你的名字">
        <input type="text" id="room-input" placeholder="输入房间代码 (如: A101)">
        <button onclick="joinRoom()">开始聊天</button>
    </div>
</div>

<!-- 主应用界面 -->
<div id="main-app">
    <div id="top-nav">
        <span id="back-btn" style="cursor:pointer; font-size: 20px;" onclick="goBack()">←</span>
        <span id="room-title">正在加载...</span>
        <span style="font-size: 20px;" onclick="toggleSettings()">⚙️</span>
    </div>

    <!-- 联系人列表视图 -->
    <div id="view-contacts" class="view-container">
        <div id="contact-list">
            <!-- 这里动态加载房间/用户 -->
            <div class="contact-item" onclick="enterRoom('公共聊天室')">
                <div class="avatar"></div>
                <div class="contact-info">
                    <span class="name">公共聊天室</span>
                    <span class="last-msg">点击进入对话...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 聊天窗口视图 -->
    <div id="view-chat" class="view-container hidden">
        <div id="chat-box"></div>
        <div id="reply-preview"></div>
        <div id="input-area">
            <div class="input-wrapper">
                <input type="text" id="message-input" placeholder="输入消息...">
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div id="bottom-nav">
        <div class="nav-item active" onclick="switchView('contacts')">💬<br>消息</div>
        <div class="nav-item" onclick="alert('通讯录功能开发中')">👥<br>通讯录</div>
        <div class="nav-item" onclick="alert('我的设置')">👤<br>我</div>
    </div>
</div>

<!-- 设置弹窗 -->
<div id="settings-modal" onclick="toggleSettings(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3>个性化设置</h3>
        <input type="text" id="custom-room-name" placeholder="修改房间名称">
        <button onclick="updateRoomName()">保存更改</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://nryaxymneqyakeykulzq.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yeWF4eW1uZXF5YWtleWt1bHpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjE3MTMsImV4cCI6MjEwMTAzNzcxM30.8DxcRaDXRBNopYo7F0bbwvHyyC7cE4zQuxn9C2ayj4M';
    
    let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentRoomCode = "";
    let mySender = "用户_" + Math.floor(Math.random() * 1000);
    let roomSubscription = null;

    // --- 核心逻辑 ---

    async function joinRoom() {
        const nameInput = document.getElementById('username').value.trim();
        currentRoomCode = document.getElementById('room-input').value.trim();
        
        if (!nameInput || !currentRoomCode) return alert("请输入名字和房间代码");

        document.getElementById('login-area').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        
        await ensureRoomExists();
        loadHistory(); // 优先完成：加载历史消息
        initRealtime();
    }

    async function ensureRoomExists() {
        const { data: room } = await supabaseClient
            .from('rooms')
            .select('*')
            .eq('room_code', currentRoomCode)
            .single();

        if (!room) {
            await supabaseClient.from('rooms').insert([{ 
                room_code: currentRoomCode, 
                room_name: currentRoomCode || "新房间" 
            }]);
        } else {
            document.getElementById('room-title').innerText = room.room_name;
        }
    }

    // 优先完成：历史消息加载优化
    async function loadHistory() {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = ""; // 清空当前内容
        
        const { data, error } = await supabaseClient
            .from('messages')
            .select('*')
            .eq('room_code', currentRoomCode)
            .order('created_at', { ascending: true });

        if (!error && data) {
            data.forEach(msg => appendMessageToUI(msg.sender, msg.content));
        }
    }

    function initRealtime() {
        if (roomSubscription) roomSubscription.unsubscribe();

        roomSubscription = supabaseClient.channel(`room_${currentRoomCode}`)
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'messages',
                filter: `room_code=eq.${currentRoomCode}`
            }, (payload) => {
                appendMessageToUI(payload.new.sender, payload.new.content);
            })
            .subscribe();
    }

    async function sendMessage() {
        const inputEl = document.getElementById('message-input');
        let content = inputEl.value.trim();
        if (!content) return;

        try {
            await supabaseClient.from('messages').insert([{ 
                room_code: currentRoomCode, 
                content: content, 
                sender: mySender,
                created_at: new Date().toISOString()
            }]);
            inputEl.value = ""; 
        } catch (e) { console.error(e); }
    }

    function appendMessageToUI(sender, content) {
        const chatBox = document.getElementById('chat-box');
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${sender === mySender ? 'right' : 'left'}`;

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

        wrapper.innerHTML = `
            <div class="msg-content">
                ${sender !== mySender ? `<span class="sender-name">${sender}</span>` : ''}
                <div style="white-space: pre-wrap;">${content}</div>
                <span class="msg-time">${timeStr}</span>
            </div>
        `;

        chatBox.appendChild(wrapper);
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    }

    // --- 导航与视图切换 ---
    function switchView(view) {
        const contactView = document.getElementById('view-contacts');
        const chatView = document.getElementById('view-chat');
        const navItems = document.querySelectorAll('.nav-item');

        if (view === 'contacts') {
            contactView.classList.remove('hidden');
            chatView.classList.add('hidden');
            navItems[0].classList.add('active');
        } else {
            contactView.classList.add('hidden');
            chatView.classList.remove('hidden');
            navItems[1].classList.add('active'); // 模拟切换到聊天页
        }
    }

    function enterRoom(name) {
        // 这里简单演示：点击联系人直接进入当前房间逻辑
        document.getElementById('room-title').innerText = name;
        switchView('chat');
        loadHistory();
    }

    function goBack() {
        if (currentRoomCode) {
            switchView('contacts');
        } else {
            location.reload();
        }
    }

    // --- 其他功能 ---
    function toggleSettings(e) {
        const modal = document.getElementById('settings-modal');
        if (e) return; 
        modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }

    async function updateRoomName() {
        const newName = document.getElementById('custom-room-name').value.trim();
        if (!newName) return;
        await supabaseClient.from('rooms').update({ room_name: newName }).eq('room_code', currentRoomCode);
        document.getElementById('room-title').innerText = newName;
        toggleSettings();
    }

    function closeUpdateModal() {
        document.getElementById('update-modal').style.display = 'none';
        localStorage.setItem('has_seen_update', 'true');
    }

    window.onload = () => {
        if (!localStorage.getItem('has_seen_update')) {
            document.getElementById('update-modal').style.display = 'flex';
        }
    };

    document.getElementById('message-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
